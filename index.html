<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National True 3D Cadastre</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI Overlay */
        #ui-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(15, 23, 42, 0.9); color: white;
            padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            width: 300px; backdrop-filter: blur(10px);
        }
        h1 { font-size: 1.2rem; margin: 0 0 10px 0; color: #38bdf8; }
        p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 20px; }
        
        /* Dynamic Data Card */
        #data-card {
            background: rgba(0,0,0,0.5); padding: 15px;
            border-radius: 8px; border-left: 4px solid #10b981;
            display: none; /* Hidden until a building is clicked */
            margin-bottom: 15px;
        }
        .data-label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; }
        .data-value { font-size: 1.1rem; font-weight: bold; margin: 5px 0 15px 0; word-break: break-all; }
        
        /* Legend */
        .legend { margin-top: 20px; font-size: 0.85rem; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h1>True 3D Volumetric Cadastre</h1>
        <p>Interactive ULPIN & Non-Linear Asset Registry</p>
        
        <!-- THE UPGRADE: API Connection UI -->
        <input type="file" id="imageInput" accept="image/*" style="margin-bottom: 15px; font-size: 14px; width: 100%; color: white;">
        <button onclick="uploadAndProcess()" style="background: #0ea5e9; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">
            Generate 3D ULPINs
        </button>
        <p id="status-text" style="font-size: 13px; margin-top: 15px; margin-bottom: 15px; color: #fbbf24; font-weight: bold;"></p>
        
        <div id="data-card">
    <div class="data-label">Selected Legal Asset</div>
    <div id="ui-unit-id" class="data-value">-</div>
    
    <div class="data-label">Official 3D ULPIN</div>
    <div id="ui-ulpin" class="data-value" style="color: #38bdf8; font-family: monospace;">-</div>

    <div class="data-label">LADM Registered Owner</div>
    <div id="ui-owner" class="data-value" style="color: #4ade80;">-</div>

    <div class="data-label">Geometry Type</div>
    <div id="ui-tier" class="data-value">True 3D PolyhedralMesh</div>
</div>

        <div class="legend">
            <div class="legend-item"><div class="dot" style="background:#64ff64;"></div> Surface Assets (Ground)</div>
            <div class="legend-item"><div class="dot" style="background:#ffa500;"></div> Air Rights (Multi-Storey)</div>
            <div class="legend-item"><div class="dot" style="background:#6464ff;"></div> Subsurface (Infrastructure)</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js and Loaders via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1e293b');
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 500, 300);
        scene.add(dirLight);

        // 3. Dynamic Model Loader Logic
        let currentCadastreModel = null;
        let loadedMeshes = [];

        function loadNewModel(modelUrl) {
            // Remove the old model and clear memory if one exists
            if (currentCadastreModel) {
                scene.remove(currentCadastreModel);
                loadedMeshes = [];
            }

            const loader = new THREE.GLTFLoader();
            const noCacheUrl = modelUrl + "?t=" + new Date().getTime(); 

            loader.load(noCacheUrl, function (gltf) {
                currentCadastreModel = gltf.scene;
                scene.add(currentCadastreModel);
                
                // GEOSPATIAL FIX: Calculate the massive UTM bounding box and center the camera
                const box = new THREE.Box3().setFromObject(gltf.scene);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(center.x, center.y - maxDim, center.z + maxDim);
                controls.target.set(center.x, center.y, center.z);
                
                gltf.scene.traverse((child) => {
                    if (child.isMesh) {
                        const edges = new THREE.EdgesGeometry(child.geometry);
                        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 }));
                        child.add(line);
                        
                        loadedMeshes.push(child);
                    }
                });

                // 🛑 ADD THIS LINE: Update the status text when rendering is complete!
                document.getElementById('status-text').innerText = "🌍 LADM 3D Cadastre Rendered Successfully!";
                
            }, undefined, function (error) {
                console.error('Error loading GLB:', error);
                document.getElementById('status-text').innerText = "❌ Error loading 3D model.";
            });
        }

        // Try to load a model immediately on page load if one exists locally
        loadNewModel('approved_cadastre.glb');

        // 4. API Upload Engine
        async function uploadAndProcess() {
            const fileInput = document.getElementById('imageInput');
            const statusText = document.getElementById('status-text');
            
            if (!fileInput.files[0]) {
                alert("Please select an image file first.");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            statusText.style.color = "#fbbf24"; 
            statusText.innerText = "⚙️ Processing True 3D Pipeline...\n(Look at your Python terminal!)";

            try {
                // Send the file to the FastAPI server
                const response = await fetch("http://localhost:8080/api/v1/process-cadastre", {
                    method: "POST",
                    body: formData
                });
                
                const result = await response.json();

                // Find this part inside uploadAndProcess():
if (result.status === "success") {
    statusText.style.color = "#4ade80"; 
    statusText.innerText = "✅ Pipeline Complete! Rendering Model...";
    
    // 🛑 CHANGE THIS LINE: Load directly from the local file path instead of the API URL
    loadNewModel('approved_cadastre.glb');
} else {
                    statusText.style.color = "#ef4444"; 
                    statusText.innerText = "❌ Error: " + result.message;
                }
            } catch (error) {
                statusText.style.color = "#ef4444";
                statusText.innerText = "❌ Network Error. Is FastAPI running on port 8080?";
                console.error(error);
            }
        }

        // 5. Interactive Raycaster (Clicking on buildings)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(loadedMeshes);

            if (intersects.length > 0) {
                let clickedObject = intersects[0].object;
// Hunt for the name on the mesh, its parent, or its grandparent
let unitName = clickedObject.name || 
               (clickedObject.parent && clickedObject.parent.name) || 
               (clickedObject.parent && clickedObject.parent.parent && clickedObject.parent.parent.name) || 
               "Unknown Asset";
                
                document.getElementById('data-card').style.display = 'block';
                document.getElementById('ui-unit-id').innerText = unitName;
                
                if (unitName.includes("METRO")) {
                    document.getElementById('ui-tier').innerText = "Subsurface Infrastructure";
                    document.getElementById('data-card').style.borderLeftColor = "#6464ff";
                } else if (unitName.includes("Floor_2")) {
                    document.getElementById('ui-tier').innerText = "Air Rights (Multi-Storey)";
                    document.getElementById('data-card').style.borderLeftColor = "#ffa500";
                } else {
                    document.getElementById('ui-tier').innerText = "Surface Registration";
                    document.getElementById('data-card').style.borderLeftColor = "#64ff64";
                }
            }
        });

        // 6. Animation Loop
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
